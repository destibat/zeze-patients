<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ZezePagnon" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="ZEZEPAGNON — Gestion de dossiers patients, cabinet médical d'Abidjan" />
    <title>ZEZEPAGNON — Dossiers Patients</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  <style>
    /* Masquer la barre de notification Google Translate sans bloquer le widget */
    iframe.goog-te-banner-frame { display: none !important; }
    #goog-gt-tt, .goog-te-balloon-frame, #goog-gt-votingframe { display: none !important; }
    body { top: 0 !important; }
    /* Cacher le conteneur du widget (positionné hors écran) */
    #google_translate_element { position: absolute; top: -9999px; left: -9999px; }
  </style>
  </head>
  <body class="bg-fond-principal font-corps text-texte-principal">
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'fr',
          includedLanguages: 'en,fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false,
        }, 'google_translate_element');
      }
      // Applique la langue mémorisée au chargement
      (function() {
        var lang = localStorage.getItem('langue_ui') || 'fr';
        if (lang !== 'fr') {
          document.cookie = 'googtrans=/fr/' + lang + '; path=/';
          document.cookie = 'googtrans=/fr/' + lang + '; path=/; domain=.' + location.hostname;
        }
      })();
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
