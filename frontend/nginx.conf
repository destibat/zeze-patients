server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html : jamais en cache (toujours récupérer la dernière version)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Assets JS/CSS : cache long (les noms de fichiers changent à chaque build)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tout le reste : SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
